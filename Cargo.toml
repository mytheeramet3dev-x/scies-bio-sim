[package]
name = "scies-bio-sim"
version = "0.1.0"
edition = "2021"
description = "Deterministic time-step biological process simulator for Rust."
license = "MIT"

[dependencies]
scies-bio-th = { path = "../github/scies-bio-th", version = "0.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = []
db = ["dep:scies-bio-db"]

[dependencies.scies-bio-db]
path = "../github/scies-bio-db"
version = "0.2"
optional = true
